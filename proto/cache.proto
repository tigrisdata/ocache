syntax = "proto3";

package cache;

option go_package = "github.com/tigrisdata/ocache/proto;proto";

import "google/api/annotations.proto";
import "coordinator/proto/cluster.proto";

service CacheService {
  rpc Put (stream PutRequest) returns (PutResponse);
  rpc PutObject (PutRequest) returns (PutResponse) {
    option (google.api.http) = {
      post: "/v1/cache/{key}"
      body: "*"
    };
  }
  rpc Get (GetRequest) returns (stream GetResponse) {
    option (google.api.http) = {
      get: "/v1/cache/{key}"
    };
  }
  rpc Delete (DeleteRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/cache/{key}"
    };
  }

  // Conditional (compare-and-swap) operations — issue #254. Each carries a
  // per-key version; a write applies only if the current version matches the
  // caller's expectation. A lost race is reported as success=false with the
  // current version, not a transport error.
  rpc GetObjectWithVersion (GetRequest) returns (GetWithVersionResponse);
  rpc PutObjectIfVersion (PutIfVersionRequest) returns (PutIfVersionResponse);
  rpc DeleteIfVersion (DeleteIfVersionRequest) returns (DeleteIfVersionResponse);

  // Streaming variants for values larger than the unary message cap (issue
  // #258). PutStreamIfVersion carries key/ttl/expected_version in the first
  // message and value bytes in the rest (like Put). GetStreamWithVersion sends
  // version+found in the first message and value bytes in the rest (like Get).
  rpc PutStreamIfVersion (stream PutIfVersionRequest) returns (PutIfVersionResponse);
  rpc GetStreamWithVersion (GetRequest) returns (stream GetWithVersionResponse);
  rpc List (ListRequest) returns (ListResponse) {
    option (google.api.http) = {
      get: "/v1/cache"
    };
  }
  // ListLocal is an internal RPC for cluster mode: queries local node only
  // Returns sorted, paginated keys from this node's storage
  rpc ListLocal (ListRequest) returns (ListResponse);

  rpc ListWithValues (ListRequest) returns (ListWithValuesResponse) {
    option (google.api.http) = {
      get: "/v1/cache-entries"
    };
  }
  // ListLocalWithValues is an internal RPC for cluster mode: queries local node only
  // Returns sorted, paginated key-value pairs from this node's storage
  rpc ListLocalWithValues (ListRequest) returns (ListWithValuesResponse);

  rpc GetTopology (GetTopologyRequest) returns (GetTopologyResponse) {
    option (google.api.http) = {
      get: "/v1/topology"
    };
  }
}

message PutRequest {
  string key = 1; // the cache key; only required in the first message
  int64 ttl_seconds = 2; // optional TTL; only used in the first message
  bytes data = 3; // raw chunk of the object
}

message PutResponse {
  bool success = 1;
  string error  = 2; // nonempty if something went wrong
}

message GetRequest {
  string key = 1;
  int64 start = 2; // inclusive byte offset in the object (0-based)
  int64 end = 3;   // inclusive byte offset (if 0 or omitted, read to EOF)
}

message GetResponse {
  bytes data = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
  string error  = 2;
}

// GetWithVersionResponse carries the value together with its current CAS
// version (issue #254). found=false means the key is absent, expired, or
// deleted; version is then an OBSERVATION TOKEN (issue #267), never 0: the
// stamp of the CAS delete that removed the key while that fence is retained,
// otherwise a fresh stamp meaning "absent as of now". Pass it back as
// expected_version to PutObjectIfVersion to order the write against any
// delete stamped after the observation; pass 0 for the unordered put-if-absent.
message GetWithVersionResponse {
  bytes data = 1;
  uint64 version = 2;
  bool found = 3;
}

message PutIfVersionRequest {
  string key = 1;
  int64 ttl_seconds = 2;
  bytes data = 3;
  uint64 expected_version = 4; // a live version, an absent read's token, or 0 = unordered put-if-absent
}

message PutIfVersionResponse {
  bool success = 1;           // true iff the CAS applied
  uint64 new_version = 2;     // the key's new version, set on success
  uint64 current_version = 3; // the key's current version, set on a mismatch (success=false)
  string error = 4;           // nonempty only on a real error (never for a plain mismatch)
}

message DeleteIfVersionRequest {
  string key = 1;
  uint64 expected_version = 2;
}

message DeleteIfVersionResponse {
  bool success = 1;           // true iff the delete applied (or the key was already absent)
  uint64 current_version = 2; // the key's current version, set on a mismatch (success=false)
  string error = 3;           // nonempty only on a real error
}

message ListRequest {
  string prefix = 1; // Optional prefix to filter keys
  string start_key = 2; // Start listing after this key (exclusive), for pagination
  int32 limit = 3; // Maximum number of keys to return (default 1000, max 1000)
  string continuation_token = 4; // Opaque token for resuming pagination
}

message ListResponse {
  repeated string keys = 1;
  string continuation_token = 2; // Token to resume listing from where this response ended
  bool has_more = 3; // True if more keys are available beyond this page
}

message KeyValue {
  string key = 1;
  bytes value = 2;
  int64 value_length = 3; // Size of the value in bytes (set even when value is omitted)
  bool value_omitted = 4; // True if the value was omitted because it exceeds the List value-size cap
}

message ListWithValuesResponse {
  repeated KeyValue entries = 1;
  string continuation_token = 2; // Token to resume listing from where this response ended
  bool has_more = 3; // True if more entries are available beyond this page
}

message GetTopologyRequest {
  // Empty request for now; might be extended in future
}

message GetTopologyResponse {
  ClusterTopology topology = 1;  // Reuse ClusterTopology from cluster.proto
  string error = 2;  // non-empty if error occurred (e.g., cluster mode not enabled)
}
