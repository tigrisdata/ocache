name: Build RocksDB Artifacts

on:
  workflow_dispatch:
    inputs:
      rocksdb_version:
        description: 'RocksDB version to build'
        required: true
        default: '10.4.2'

env:
  ROCKSDB_VERSION: ${{ github.event.inputs.rocksdb_version || '10.4.2' }}

jobs:
  build-artifacts:
    strategy:
      matrix:
        # Two variants on Linux (plain + jemalloc, see issue #176); jemalloc is
        # Linux-only, so macOS builds the plain variant only.
        include:
          - os: namespace-profile-ubuntu-2404
            arch: x86_64
            variant: plain
          - os: namespace-profile-ubuntu-2404
            arch: x86_64
            variant: jemalloc
          - os: namespace-profile-ubuntu-2404-arm
            arch: aarch64
            variant: plain
          - os: namespace-profile-ubuntu-2404-arm
            arch: aarch64
            variant: jemalloc
          - os: namespace-profile-macos-1561-arm
            arch: arm64
            variant: plain
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # bzip2 is needed to extract the jemalloc release tarball (.tar.bz2).
          sudo apt-get install -y build-essential cmake bzip2 libsnappy-dev \
            liblz4-dev libzstd-dev zlib1g-dev libbz2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake snappy lz4 zstd

      - name: Build RocksDB static library
        run: |
          ROCKSDB_VERSION=${{ env.ROCKSDB_VERSION }} \
          ARCH=${{ matrix.arch }} \
          OS=${{ runner.os }} \
          VARIANT=${{ matrix.variant }} \
          make build-rocksdb-static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocksdb-static-${{ env.ROCKSDB_VERSION }}-${{ matrix.variant }}-${{ runner.os }}-${{ matrix.arch }}
          path: rocksdb-static/rocksdb-static-*.tar.gz
          retention-days: 90

  create-release:
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: rocksdb-v${{ env.ROCKSDB_VERSION }}
          release_name: RocksDB ${{ env.ROCKSDB_VERSION }} Static Libraries
          body: |
            Pre-built static RocksDB libraries for various platforms.

            ## Supported Platforms
            - Linux x86_64 (plain, jemalloc)
            - Linux aarch64 (plain, jemalloc)
            - macOS arm64 (plain)

            ## Variants
            - **plain** — `rocksdb-static-<ver>-<os>-<arch>.tar.gz`: RocksDB only.
            - **jemalloc** — `rocksdb-static-<ver>-jemalloc-<os>-<arch>.tar.gz`
              (Linux only): RocksDB built `WITH_JEMALLOC=ON`, with a static
              `libjemalloc.a` (empty prefix) bundled in `lib/` so the final binary
              can link jemalloc as the process allocator to cap RocksDB off-heap
              RSS. See issue #176.

            ## Usage
            1. Download the appropriate artifact for your platform and variant
            2. Extract to your project directory
            3. Set build flags:
               ```
               export CGO_CFLAGS="-I/path/to/extracted/include"
               # plain:
               export CGO_LDFLAGS="-L/path/to/extracted/lib -lrocksdb -lstdc++ -lm -lz -lbz2 -lsnappy -llz4 -lzstd -pthread"
               # jemalloc (add -ljemalloc to make jemalloc the process allocator):
               export CGO_LDFLAGS="-L/path/to/extracted/lib -lrocksdb -ljemalloc -lstdc++ -lm -lz -lbz2 -lsnappy -llz4 -lzstd -pthread"
               ```
          draft: false
          prerelease: false
      
      - name: Upload Release Assets
        run: |
          for artifact in artifacts/*/rocksdb-static-*.tar.gz; do
            asset_name=$(basename "$artifact")
            echo "Uploading $asset_name..."
            gh release upload "rocksdb-v${{ env.ROCKSDB_VERSION }}" "$artifact" \
              --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}