name: Build RocksDB Artifacts

on:
  workflow_dispatch:
    inputs:
      rocksdb_version:
        description: 'RocksDB version to build'
        required: true
        default: '10.4.2'

env:
  ROCKSDB_VERSION: ${{ github.event.inputs.rocksdb_version || '10.4.2' }}

jobs:
  build-artifacts:
    strategy:
      matrix:
        # Two variants on Linux (plain + jemalloc, see issue #176); jemalloc is
        # Linux-only, so macOS builds the plain variant only.
        include:
          - os: namespace-profile-ubuntu-2404
            arch: x86_64
            variant: plain
          - os: namespace-profile-ubuntu-2404
            arch: x86_64
            variant: jemalloc
          - os: namespace-profile-ubuntu-2404-arm
            arch: aarch64
            variant: plain
          - os: namespace-profile-ubuntu-2404-arm
            arch: aarch64
            variant: jemalloc
          - os: namespace-profile-macos-1561-arm
            arch: arm64
            variant: plain
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # bzip2 is needed to extract the jemalloc release tarball (.tar.bz2).
          sudo apt-get install -y build-essential cmake bzip2 libsnappy-dev \
            liblz4-dev libzstd-dev zlib1g-dev libbz2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake snappy lz4 zstd

      - name: Build RocksDB static library
        run: |
          ROCKSDB_VERSION=${{ env.ROCKSDB_VERSION }} \
          ARCH=${{ matrix.arch }} \
          OS=${{ runner.os }} \
          VARIANT=${{ matrix.variant }} \
          make build-rocksdb-static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocksdb-static-${{ env.ROCKSDB_VERSION }}-${{ matrix.variant }}-${{ runner.os }}-${{ matrix.arch }}
          path: rocksdb-static/rocksdb-static-*.tar.gz
          retention-days: 90

  create-release:
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      # Create the release only if it doesn't already exist. actions/create-release
      # hard-fails with "already_exists" when re-running for a version whose
      # release was published by an earlier run (e.g. adding the jemalloc variant
      # to an existing version), which then skips the asset upload below. The
      # upload step uses --clobber, so on a re-run we skip creation and just
      # add/refresh assets.
      - name: Create release if absent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="rocksdb-v${{ env.ROCKSDB_VERSION }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; the upload step will add/refresh its assets."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RocksDB ${{ env.ROCKSDB_VERSION }} Static Libraries" \
              --notes "Pre-built static RocksDB libraries. Variants: plain (\`rocksdb-static-<ver>-<os>-<arch>.tar.gz\`) and Linux-only jemalloc (\`...-jemalloc-...\`; RocksDB WITH_JEMALLOC=ON with a bundled empty-prefix libjemalloc.a — add \`-ljemalloc\` when linking). See scripts/build-rocksdb-static.sh and issue #176."
          fi

      - name: Upload Release Assets
        run: |
          for artifact in artifacts/*/rocksdb-static-*.tar.gz; do
            asset_name=$(basename "$artifact")
            echo "Uploading $asset_name..."
            gh release upload "rocksdb-v${{ env.ROCKSDB_VERSION }}" "$artifact" \
              --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}