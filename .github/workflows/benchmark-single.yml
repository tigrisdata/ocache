name: Benchmark Single Node

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

env:
  GO_VERSION: "1.24.2"
  ROCKSDB_VERSION: "10.4.2"
  GOWORK: ${{ github.workspace }}/go.work
  GOPRIVATE: github.com/tigrisdata/ocache/*

jobs:
  benchmark-single:
    strategy:
      # Run both allocator variants so their throughput/latency can be compared
      # (A/B for issue #176); don't cancel one variant if the other fails.
      fail-fast: false
      matrix:
        include:
          - os: namespace-profile-ubuntu-2404-medium
            arch: x86_64
            variant: plain
          - os: namespace-profile-ubuntu-2404-medium
            arch: x86_64
            variant: jemalloc
    runs-on: ${{ matrix.os }}

    permissions:
      actions: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # bzip2 extracts jemalloc's .tar.bz2 if the source-build fallback runs.
          sudo apt-get install -y build-essential cmake bzip2 libgflags-dev \
            libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev libbz2-dev netcat-openbsd

      - name: Set OS name
        id: os-name
        run: |
          OS_NAME=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          echo "os_name=${OS_NAME}" >> $GITHUB_OUTPUT
          # Pick the rocksdb-static variant (plain vs jemalloc) for this A/B leg.
          # runner.os casing (Linux) matches the published asset names.
          SUFFIX=""
          if [ "${{ matrix.variant }}" = "jemalloc" ]; then SUFFIX="-jemalloc"; fi
          echo "art_name=rocksdb-static-${{ env.ROCKSDB_VERSION }}${SUFFIX}-${{ runner.os }}-${{ matrix.arch }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Cache RocksDB static artifact
        uses: actions/cache@v4
        id: cache-rocksdb-static
        with:
          path: ${{ steps.os-name.outputs.art_name }}
          key: ${{ runner.os }}-rocksdb-static-${{ env.ROCKSDB_VERSION }}-${{ matrix.arch }}-${{ matrix.variant }}-v6

      - name: Download pre-built RocksDB artifact
        if: steps.cache-rocksdb-static.outputs.cache-hit != 'true'
        run: |
          # Try to download from GitHub releases first
          ARTIFACT_NAME="${{ steps.os-name.outputs.art_name }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/rocksdb-v${{ env.ROCKSDB_VERSION }}/${ARTIFACT_NAME}"

          if curl -fsSL -o "${ARTIFACT_NAME}" "${RELEASE_URL}"; then
            echo "Downloaded pre-built artifact from release"
          else
            echo "Pre-built artifact not found, building from source..."
            ROCKSDB_VERSION=${{ env.ROCKSDB_VERSION }} \
            OS=${{ runner.os }} \
            ARCH=${{ matrix.arch }} \
            VARIANT=${{ matrix.variant }} \
            make build-rocksdb-static
            mv rocksdb-static/rocksdb-static-*.tar.gz .
          fi

      - name: Extract RocksDB static artifact
        run: |
          mkdir -p rocksdb-static/artifact
          tar xzf "${{ steps.os-name.outputs.art_name }}" -C rocksdb-static/artifact
          ls -la rocksdb-static/artifact/

      - name: Install dependencies
        run: make install-deps

      - name: Generate proto files
        run: make proto

      - name: Build server and CLI
        run: STATIC_BUILD=true WITH_JEMALLOC=${{ matrix.variant == 'jemalloc' }} make all

      - name: Start OCache server
        run: |
          echo "Starting OCache server..."
          make run-background
          echo "SERVER_PID=$(cat ocache.pid)" >> $GITHUB_ENV

          # Wait for server to be ready
          for i in {1..30}; do
            if nc -z localhost 9000 2>/dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server to start..."
            sleep 1
          done

      - name: Start RSS sampler
        run: |
          # Record the server's RSS (VmRSS/RssAnon/VmData) across all benchmarks
          # so plain vs jemalloc allocator footprint can be compared (issue #176).
          nohup bash scripts/rss-sample.sh rss-samples.csv 1 "${SERVER_PID}" >/dev/null 2>&1 &
          echo "RSS_SAMPLER_PID=$!" >> $GITHUB_ENV

      - name: Run read-heavy benchmark - 100 bytes
        run: |
          echo "=== Running benchmark with 100 byte objects ==="
          ./ocachecli bench --addr localhost:9000 --mode simple --connection-pool-size 4 --num-ops 100000 --value-size 100 --workload "read=80,update=20" --no-progress | tee 100-byte-read-80-update-20.log

      - name: Run write-heavy benchmark - 100 bytes
        run: |
          echo "=== Running benchmark with 100 byte objects ==="
          ./ocachecli bench --addr localhost:9000 --mode simple --connection-pool-size 4 --num-ops 100000 --value-size 100 --workload "read=20,update=80" --no-progress | tee 100-byte-read-20-update-80.log

      - name: Run read-heavy benchmark - 100 KB
        run: |
          echo "=== Running benchmark with 100 KB objects ==="
          ./ocachecli bench --addr localhost:9000 --mode simple --connection-pool-size 4 --num-ops 100000 --value-size 102400 --workload "read=80,update=20" --no-progress | tee 100kb-read-80-update-20.log

      - name: Run read-heavy benchmark - 1 MB
        run: |
          echo "=== Running benchmark with 1 MB objects ==="
          ./ocachecli bench --addr localhost:9000 --mode simple --connection-pool-size 4 --num-ops 10000 --value-size 1048576 --workload "read=80,update=20" --no-progress | tee 1mb-read-80-update-20.log

      - name: Run read-heavy benchmark - 10 MB
        run: |
          echo "=== Running benchmark with 10 MB objects ==="
          ./ocachecli bench --addr localhost:9000 --mode simple --connection-pool-size 4 --num-ops 10000 --value-size 10485760 --workload "read=80,update=20" --no-progress | tee 10mb-read-80-update-20.log

      - name: Run compaction-interleaved benchmark - 256 KB, high churn
        run: |
          echo "=== 256KB values, narrow keyspace, update-heavy → continuous raw-file → segment compaction under write pressure ==="
          # Values land in the RAW_FILE tier (> InlineThreshold 64KB, < CompactThreshold 16MB) and
          # the narrow keyspace drives many updates per key, so the background compactor is racing
          # with Put on the same keys throughout the run. This is the workload shape of issue #142
          # and serves as a performance-regression guard on the compactor commit path.
          ./ocachecli bench --addr localhost:9000 --mode simple --connection-pool-size 4 --concurrency 16 --num-keys 2000 --num-ops 500000 --value-size 262144 --workload "read=30,update=70" --no-progress | tee 256kb-compaction-churn.log

      - name: Stop RSS sampler and summarize
        if: always()
        run: |
          kill "${RSS_SAMPLER_PID}" 2>/dev/null || true
          sleep 1
          echo "=== RSS summary (variant: ${{ matrix.variant }}) ==="
          bash scripts/rss-summary.sh rss-samples.csv | tee rss-summary.txt

      - name: Stop server
        if: always()
        run: |
          echo "Stopping OCache server (PID: ${SERVER_PID})"
          make stop

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-node-benchmark-results-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            *.log
            *.out
            rss-samples.csv
            rss-summary.txt
